# Fase 1 - CI/CD pipeline: matriz de pruebas unitarias, verificación MCP, validación de contenedores.
#
# Triggers:
#   push a main/master
#   pull request
#   ejecución manual (workflow_dispatch)
#
# Estructura:
#   1. validate (matriz) -> mvn clean test bajo JDK 17 y 21 + pyflakes
#   2. mcp-smoke -> valida el contrato JSON-RPC del servidor MCP sobre stdio
#   3. package    -> construye y verifica las imágenes de contenedor (build --no-cache, healthcheck)

name: CI/CD - Fase 1

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSIONS: '["17", "21"]'
  MAVEN_OPTS: -Dhttps.protocols=TLSv1.2

jobs:
  validate:
    name: Pruebas unitarias Java (matriz JDK)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ${{ fromJSON(env.JAVA_VERSIONS) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Lint Python (servidor MCP)
        run: |
          python -m pip install --upgrade pip pyflakes
          pyflakes mcp-server/server.py
          python -c "import ast; ast.parse(open('mcp-server/server.py').read()); print('py_compile OK')"

      - name: Maven build + unit tests (JDK ${{ matrix.java }})
        run: mvn -B -f target-codebase/pom.xml clean test

  mcp-smoke:
    name: Smoke test contrato MCP (JSON-RPC 2.0 / stdio)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mcp-server/requirements.txt

      - name: Instalar dependencias MCP
        run: pip install --upgrade -r mcp-server/requirements.txt

      - name: Ejecutar smoke test MCP
        timeout-minutes: 10
        run: python verifier/smoke_test_mcp.py

      - name: Reporte del sobre MCP
        id: envelope
        run: |
          echo "Contrato MCP validado: envoltura JSON unificada (SUCCESS / INVALID_INPUT / INTERNAL_ERROR)"
          echo "status=SUCCESS" >> $GITHUB_OUTPUT

  package:
    name: Empaquetado y verificación de contenedores
    runs-on: ubuntu-latest
    needs: [validate, mcp-smoke]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imágenes Java y MCP (--no-cache)
        run: |
          set -e
          # Construcción determinista sin caché para entornos CI / headless
          docker compose build --no-cache \
            --progress=plain \
            --build-arg BUILDKIT_INLINE_CACHE=1
          echo "Imágenes construidas:"
          docker images --format "{{.Repository}}:{{.Tag}} ({{.Size}})" | grep mcp-java

      - name: Verificar usuario no-root en runtime
        run: |
          # El container runtime debe ejecutarse como usuario no privilegiado.
          echo "Java service:  $(docker run --rm mcp-java-benchmark:latest id -u) $(docker run --rm mcp-java-benchmark:latest id -un)"
          echo "MCP service:   $(docker run --rm mcp-java-mcp-server:latest id -u) $(docker run --rm mcp-java-mcp-server:latest id -un)"

      - name: Verificar arranque y salida determinista de la imagen Java
        run: |
          set -e
          OUTPUT=$(docker run --rm mcp-java-benchmark:latest)
          echo "$OUTPUT"
          echo "$OUTPUT" | python -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='SUCCESS'; print('BenchmarkRunner JSON: OK', d['orders'], 'orders')"

      - name: Verificar arranque del MCP server (handshake + list_tools)
        run: |
          set -e
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1.0.0"}}}' \
            | docker run --rm -i mcp-java-mcp-server:latest \
            | python -c "import json,sys; d=json.load(sys.stdin); assert 'result' in d and 'tools' in d['result']; print('MCP init OK:', [t['name'] for t in d['result']['tools']])"

      - name: Reporte de empaquetado
        id: package
        run: |
          echo "Empaquetado verificado: 2 imágenes (Java + MCP), non-root, handshake MCP OK"
          echo "status=SUCCESS" >> $GITHUB_OUTPUT

  # Job opcional de orquestación completa en compose (solo se ejecuta en push a main/master)
  compose-e2e:
    name: E2E con docker compose (main/master)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: package
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Subir artefacto Java (si está disponible)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-codebase-build
          path: target-codebase/target/*.jar
          if-no-files-found: warn
